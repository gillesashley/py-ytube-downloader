<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}YTube Downloader{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --surface: rgba(30, 41, 59, .72);
    --surface-solid: #1e293b;
    --border: rgba(255, 255, 255, .08);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #ec4899;
    --accent-strong: #f472b6;
    --link: #60a5fa;
    --success: #34d399;
    --danger: #f87171;
    --radius: 12px;
    --shadow: 0 10px 30px rgba(2, 6, 23, .45);
    --ring: 2px solid var(--accent);
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background:
      radial-gradient(640px 320px at 12% -10%, rgba(236, 72, 153, .13), transparent 60%),
      radial-gradient(720px 360px at 88% -10%, rgba(37, 99, 235, .12), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.6;
    min-height: 100dvh;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  a { color: var(--link); }
  a:hover { color: var(--accent-strong); }
  :focus-visible { outline: var(--ring); outline-offset: 2px; border-radius: 4px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; margin-bottom: 2.25rem;
  }
  .brand { display: flex; align-items: center; gap: .6rem; font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; }
  .brand svg { color: var(--accent); flex-shrink: 0; }
  .user { font-size: .85rem; color: var(--muted); white-space: nowrap; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
  }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0 0 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .hint { margin: 0 0 1.25rem; color: var(--muted); font-size: .9rem; }
  .row { display: flex; gap: .75rem; }
  .row input { flex: 1; }

  input[type=url], input[type=password], input[type=text] {
    width: 100%; padding: .7rem .9rem;
    background: rgba(2, 6, 23, .55); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    font: inherit; font-size: 1rem;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(236, 72, 153, .18); }

  .btn {
    display: inline-flex; align-items: center; gap: .45rem;
    padding: .7rem 1.25rem; border-radius: 10px;
    border: 1px solid transparent; cursor: pointer;
    font: inherit; font-weight: 600; font-size: .95rem;
    color: var(--text); background: var(--surface-solid);
    text-decoration: none; white-space: nowrap;
    transition: background .2s, transform .15s, box-shadow .2s;
  }
  .btn:hover { background: #2b3b57; color: var(--text); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), #d946ef);
    color: #fff; box-shadow: 0 6px 20px rgba(236, 72, 153, .3);
  }
  .btn.primary:hover { background: linear-gradient(135deg, var(--accent-strong), #e879f9); box-shadow: 0 8px 24px rgba(236, 72, 153, .4); }
  .btn.small { padding: .45rem .8rem; font-size: .85rem; }
  .btn.icon { padding: .45rem; border-radius: 8px; color: var(--muted); }
  .btn.icon:hover { color: var(--danger); background: rgba(248, 113, 113, .12); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: rgba(248, 113, 113, .12); }
  form.inline { display: inline; }

  .msgs { margin-bottom: 1.25rem; }
  .msg {
    padding: .7rem .95rem; border-radius: 10px; margin-bottom: .6rem;
    border: 1px solid var(--border); font-size: .9rem;
    animation: slide-in .25s ease-out;
  }
  .msg.success { background: rgba(52, 211, 153, .12); border-color: rgba(52, 211, 153, .35); color: var(--success); }
  .msg.error { background: rgba(248, 113, 113, .12); border-color: rgba(248, 113, 113, .35); color: var(--danger); }
  @keyframes slide-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  .form-card { margin-bottom: 2.5rem; }
  .jobs h2 { display: flex; align-items: center; gap: .5rem; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: .75rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); padding: 0 1rem .6rem;
  }
  td { padding: .85rem 1rem; border-top: 1px solid var(--border); vertical-align: middle; }
  .job-title { display: block; font-weight: 600; font-size: .95rem; line-height: 1.4; }
  .job-url { display: block; font-size: .8rem; color: var(--muted); text-decoration: none; margin-top: .15rem; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-url:hover { color: var(--accent-strong); }
  .err { color: var(--danger); font-size: .8rem; margin-top: .3rem; line-height: 1.4; }
  .muted { color: var(--muted); }

  .pill {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .22rem .7rem; border-radius: 999px;
    font-size: .78rem; font-weight: 600; letter-spacing: .02em;
    border: 1px solid var(--border); background: var(--surface-solid);
  }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .pill-running { color: var(--accent-strong); border-color: rgba(236, 72, 153, .4); }
  .pill-running::before { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .pill-done { color: var(--success); border-color: rgba(52, 211, 153, .4); }
  .pill-done::before { background: var(--success); }
  .pill-failed { color: var(--danger); border-color: rgba(248, 113, 113, .4); }
  .pill-failed::before { background: var(--danger); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  .bar {
    width: 130px; height: 8px; border-radius: 999px;
    background: rgba(2, 6, 23, .55); overflow: hidden;
    display: inline-block; vertical-align: middle;
  }
  .bar > div {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), #d946ef);
    transition: width .4s ease-out;
  }
  .pct { margin-left: .5rem; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .td-action { text-align: right; white-space: nowrap; }

  .empty {
    text-align: center; padding: 3rem 1rem;
    border: 1px dashed var(--border); border-radius: var(--radius);
    color: var(--muted);
  }
  .empty svg { color: #334155; margin-bottom: .75rem; }
  .empty p { margin: 0; font-size: .9rem; }

  @media (max-width: 640px) {
    .wrap { padding-top: 1.25rem; }
    header { margin-bottom: 1.5rem; }
    .row { flex-direction: column; }
    .row .btn { justify-content: center; }
    .table-wrap { overflow: visible; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .5rem 1rem; margin-bottom: .8rem;
    }
    td { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .5rem 0; border-top: none; }
    td + td { border-top: 1px solid var(--border); }
    td::before { content: attr(data-label); font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    td:first-child::before { display: none; }
    .job-url { max-width: 22ch; }
    .bar { width: 100px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      YTube Downloader
    </div>
    <div class="user">
      {% if user.is_authenticated %}{{ user.username }} &middot; <a href="{% url 'logout' %}">log out</a>{% endif %}
    </div>
  </header>
  {% if messages %}
    <div class="msgs">
      {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
