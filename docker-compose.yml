services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-prod}
      - DEBUG=0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}

volumes:
  media:
